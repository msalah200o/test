<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>طلب دعم</title>
</head>
<body>
  <p>اختار تطبيق الإيميل:</p>

  <a id="mailBtn" href="#">فتح في Mail / التطبيق الافتراضي</a>
  <br><br>
  <a id="outlookBtn" href="#">فتح في Outlook</a>
  <br><br>
  <a id="gmailBtn" href="#">فتح في Gmail</a>

<script>
  const to = "support@example.com";
  const subject = encodeURIComponent("طلب دعم");
  const body = encodeURIComponent("الاسم:\nالقسم:");

  const ua = navigator.userAgent;
  const isAndroid = /Android/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua);

  // التطبيق الافتراضي (شغال على الاتنين)
  document.getElementById("mailBtn").href =
    `mailto:${to}?subject=${subject}&body=${body}`;

  // Outlook
  document.getElementById("outlookBtn").href = isAndroid
    ? `intent://compose?to=${to}&subject=${subject}&body=${body}#Intent;scheme=ms-outlook;package=com.microsoft.office.outlook;end`
    : `ms-outlook://compose?to=${to}&subject=${subject}&body=${body}`;

  // Gmail
  document.getElementById("gmailBtn").href = isAndroid
    ? `intent://co?to=${to}&subject=${subject}&body=${body}#Intent;scheme=googlegmail;package=com.google.android.gm;end`
    : `googlegmail:///co?to=${to}&subject=${subject}&body=${body}`;
</script>
</body>
</html>
