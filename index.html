<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>طلب دعم</title>
</head>
<body>
  <p>اختار تطبيق الإيميل:</p>

  <a id="mailBtn" href="#">فتح في التطبيق الافتراضي</a>
  <br><br>
  <a id="outlookBtn" href="#">فتح في Outlook</a>
  <br><br>
  <a id="gmailBtn" href="#">فتح في Gmail</a>

<script>
  const to = "support@example.com";
  const subject = encodeURIComponent("طلب دعم");
  const body = encodeURIComponent("الاسم:\nالقسم:");
  const query = `subject=${subject}&body=${body}`;

  const isAndroid = /Android/i.test(navigator.userAgent);

  // الافتراضي: على أندرويد هيظهر اختيار التطبيقات
  document.getElementById("mailBtn").href = `mailto:${to}?${query}`;

  if (isAndroid) {
    // نفس mailto لكن مقفول على تطبيق معين
    document.getElementById("outlookBtn").href =
      `intent:${to}?${query}#Intent;scheme=mailto;action=android.intent.action.SENDTO;package=com.microsoft.office.outlook;end`;

    document.getElementById("gmailBtn").href =
      `intent:${to}?${query}#Intent;scheme=mailto;action=android.intent.action.SENDTO;package=com.google.android.gm;end`;
  } else {
    document.getElementById("outlookBtn").href =
      `ms-outlook://compose?to=${to}&${query}`;
    document.getElementById("gmailBtn").href =
      `googlegmail:///co?to=${to}&${query}`;
  }
</script>
</body>
</html>
